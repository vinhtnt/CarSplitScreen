name: Build CarSplitScreen APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK
        run: |
          PROJ_DIR=$(dirname "$(find . -maxdepth 3 -name 'settings.gradle' | head -n 1)")
          echo "Building in: $PROJ_DIR"
          cd "$PROJ_DIR"
          gradle assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/CarSplitScreen.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CarSplitScreen-APK
          path: CarSplitScreen.apk
